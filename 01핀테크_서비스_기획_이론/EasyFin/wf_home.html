<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>WF-02 홈 / 대시보드</title>
  <link rel="stylesheet" href="styles.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div class="mobile-container">
<div id="root"></div>
</div>
<script type="text/babel" data-presets="react">
const API_BASE = "http://localhost:8000";

function AppBar({ title }) {
  return (
    <header className="appbar">
      <div className="appbar__title">{title}</div>
      <div className="appbar__actions">
        <button className="icon-button">🔍</button>
        <button className="icon-button">🔔</button>
      </div>
    </header>
  );
}

function HomeScreen() {
  const [summary, setSummary] = React.useState(null);
  const [accounts, setAccounts] = React.useState([]);

  React.useEffect(() => {
    fetch(`${API_BASE}/assets/summary`)
      .then(res => res.json())
      .then(setSummary)
      .catch(console.error);
    fetch(`${API_BASE}/assets/accounts`)
      .then(res => res.json())
      .then(setAccounts)
      .catch(console.error);
  }, []);

  return (
    <div className="screen">
      <AppBar title="홈" />
      <div className="screen__content">
        <section className="card">
          <h2>통합 자산 현황</h2>
          {summary ? (
            <React.Fragment>
              <div className="asset__total">
                총 자산{" "}
                <strong>
                  {summary.total_amount.toLocaleString()} {summary.currency}
                </strong>
              </div>
              <ul className="asset__breakdown">
                {Object.entries(summary.breakdown).map(([k, v]) => (
                  <li key={k}>
                    <span>{k}</span>
                    <span>{v.toLocaleString()}원</span>
                  </li>
                ))}
              </ul>
            </React.Fragment>
          ) : (
            <div>불러오는 중...</div>
          )}
        </section>

        <section className="card">
          <h2>계좌별 요약</h2>
          <ul className="account-list">
            {accounts.map(acc => (
              <li key={acc.id} className="account-list__item">
                <div className="account-list__title">
                  {acc.institution} · {acc.name}
                </div>
                <div className="account-list__meta">
                  <span>{acc.type}</span>
                  <span className="account-list__balance">
                    {acc.balance.toLocaleString()}원
                  </span>
                </div>
              </li>
            ))}
          </ul>
        </section>

        <section className="card">
          <h2>추천 라이브</h2>
          <p>라이브 탭에서 자세히 보기</p>
        </section>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<HomeScreen />);
</script>
</body>
</html>
