<!DOCTYPE html>
<html lang="ko">

  <meta charset="UTF-8" />

  <link rel="stylesheet" href="styles.css" />

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
<div class="mobile-container">
  <div id="root"></div>
</div>

<script type="text/babel" data-presets="react">

/* =============================
   공통 AppBar
   ============================= */
function AppBar({ title }) {
  return (
    <header className="appbar">
      <div className="appbar__title">{title}</div>
      <div className="appbar__actions">
        <button className="icon-button">🔍</button>
        <button className="icon-button">🔔</button>
      </div>
    </header>
  );
}

/* =============================
   공통 BottomNav (와이어프레임 스타일)
   ============================= */
function BottomNav({ active, onChange }) {
  const items = ["홈", "마켓", "라이브", "커뮤니티", "마이"];

  return (
    <nav className="bottom-nav">
      {items.map((name) => (
        <button
          key={name}
          type="button"
          className={
            "bottom-nav__item" +
            (active === name ? " bottom-nav__item--active" : "")
          }
          onClick={() => onChange && onChange(name)}
        >
          <span className="bottom-nav__label">{name}</span>
        </button>
      ))}
    </nav>
  );
}

/* =============================
   AuthScreen (로그인 / 회원가입)
   - 와이어프레임 느낌 + 더미 로그인
   ============================= */
function AuthScreen({ onLogin }) {
  const [mode, setMode] = React.useState("login"); // "login" | "signup"

  const [loginEmail, setLoginEmail] = React.useState("demo@easyfin.app");
  const [loginPassword, setLoginPassword] = React.useState("1234");

  const [signupNickname, setSignupNickname] = React.useState("");
  const [signupEmail, setSignupEmail] = React.useState("");
  const [signupPassword, setSignupPassword] = React.useState("");
  const [signupPasswordConfirm, setSignupPasswordConfirm] = React.useState("");
  const [agreeTerms, setAgreeTerms] = React.useState(false);

  const [signupError, setSignupError] = React.useState("");

  const handleLogin = (e) => {
    e.preventDefault();
    // 실제 API 대신 더미 사용자로 바로 로그인
    onLogin({
      nickname: "EasyFin 사용자",
      email: loginEmail,
    });
  };

  const handleSignup = (e) => {
    e.preventDefault();
    setSignupError("");

    if (!signupNickname || !signupEmail || !signupPassword || !signupPasswordConfirm) {
      setSignupError("모든 필드를 입력해 주세요.");
      return;
    }
    if (signupPassword !== signupPasswordConfirm) {
      setSignupError("비밀번호와 비밀번호 확인이 일치하지 않습니다.");
      return;
    }
    if (!agreeTerms) {
      setSignupError("필수 약관에 동의해 주세요.");
      return;
    }

    onLogin({
      nickname: signupNickname,
      email: signupEmail,
    });
  };

  return (
    <div className="screen screen--center">
      <h1 className="logo">EasyFin V2.0</h1>
      <p className="login__subtitle">
        당신의 자산을 한 번에, 라이브로 쉽게 이해하세요.
      </p>

      {/* 로그인 / 회원가입 탭 */}
      <div className="auth-toggle card">
        <button
          className={
            "auth-toggle__btn" +
            (mode === "login" ? " auth-toggle__btn--active" : "")
          }
          onClick={() => setMode("login")}
        >
          로그인
        </button>
        <button
          className={
            "auth-toggle__btn" +
            (mode === "signup" ? " auth-toggle__btn--active" : "")
          }
          onClick={() => setMode("signup")}
        >
          회원가입
        </button>
      </div>

      {mode === "login" ? (
        <form className="card login__form" onSubmit={handleLogin}>
          <label className="form-field">
            <span>이메일</span>
            <input
              value={loginEmail}
              onChange={(e) => setLoginEmail(e.target.value)}
            />
          </label>
          <label className="form-field">
            <span>비밀번호</span>
            <input
              type="password"
              value={loginPassword}
              onChange={(e) => setLoginPassword(e.target.value)}
            />
          </label>
          <button type="submit" className="btn btn--primary">
            로그인
          </button>
          <div className="login__hint">
            데모 계정: demo@easyfin.app / 1234
          </div>
        </form>
      ) : (
        <form className="card login__form" onSubmit={handleSignup}>
          <label className="form-field">
            <span>닉네임</span>
            <input
              value={signupNickname}
              onChange={(e) => setSignupNickname(e.target.value)}
              placeholder="예: 지현"
            />
          </label>
          <label className="form-field">
            <span>이메일</span>
            <input
              type="email"
              value={signupEmail}
              onChange={(e) => setSignupEmail(e.target.value)}
              placeholder="you@example.com"
            />
          </label>
          <label className="form-field">
            <span>비밀번호</span>
            <input
              type="password"
              value={signupPassword}
              onChange={(e) => setSignupPassword(e.target.value)}
            />
          </label>
          <label className="form-field">
            <span>비밀번호 확인</span>
            <input
              type="password"
              value={signupPasswordConfirm}
              onChange={(e) => setSignupPasswordConfirm(e.target.value)}
            />
          </label>

          <label className="form-field form-field--row">
            <input
              type="checkbox"
              checked={agreeTerms}
              onChange={(e) => setAgreeTerms(e.target.checked)}
            />
            <span>필수 약관에 동의합니다.</span>
          </label>

          {signupError && <div className="form-error">{signupError}</div>}
          <button type="submit" className="btn btn--primary">
            회원가입 완료
          </button>
        </form>
      )}
    </div>
  );
}

    },
    {
      id: 4,
      name: "국채 10년 만기 채권",
      code: "BOND-10Y",
      category: "채권",
      risk_level: "낮음",
      expected_yield: 3.1,
      description: "대한민국 국채 10년물, 안정적인 금리 기반 상품.",
    },

      risk_level: "중간",

  const [category, setCategory] = React.useState("전체");

              onClick={(e) => e.stopPropagation()}
            >
              <h3>{selected.name}</h3>

              <button
                className="btn"

                onClick={() => setSelected(null)}
              >
                닫기
              </button>
            </div>
          </div>
        )}

}

/* =============================
   WF-05 커뮤니티 화면 (더미 데이터)
   ============================= */
function CommunityScreen({ user }) {
  const [posts, setPosts] = React.useState([
    {
      id: 1,
      title: "ETF 초보 질문드립니다",
      author: "지현",
      content: "ETF는 무엇부터 공부하면 좋을까요?",
      time: "2시간 전",
    },
    {
      id: 2,
      title: "오늘 공모주 경쟁률 보신 분?",
      author: "투자왕",
      content: "에코그린 경쟁률 미쳤네요ㅋㅋ",
      time: "1시간 전",
    },
  ]);

  const [openId, setOpenId] = React.useState(null);
  const [newTitle, setNewTitle] = React.useState("");
  const [newContent, setNewContent] = React.useState("");

  const submit = () => {
    if (!newTitle || !newContent) {
      alert("제목과 내용을 입력해주세요.");
      return;
    }
    setPosts((prev) => [
      ...prev,
      {
        id: prev.length + 1,
        title: newTitle,
        author: user?.nickname || "익명",
        content: newContent,
        time: "방금 전",
      },
    ]);
    setNewTitle("");
    setNewContent("");
  };

  return (
    <div className="screen">
      <AppBar title="커뮤니티" />
      <div className="screen__content">
        <section className="card">
          <h2>게시글 작성</h2>
          <input
            type="text"
            placeholder="제목"
            className="input"
            value={newTitle}
            onChange={(e) => setNewTitle(e.target.value)}
            style={{ marginTop: "8px" }}
          />
          <textarea
            placeholder="내용을 입력하세요"
            className="input"
            style={{ marginTop: "8px", height: "80px" }}
            value={newContent}
            onChange={(e) => setNewContent(e.target.value)}
          />
          <button
            className="btn"
            style={{ marginTop: "12px" }}
            onClick={submit}
          >
            등록하기
          </button>
        </section>

        <section className="card">
          <h2>게시글 목록</h2>
          <ul className="market-list">
            {posts.map((p) => (
              <li
                key={p.id}
                className="market-list__item"
                onClick={() => setOpenId(openId === p.id ? null : p.id)}
              >
                <div className="market-list__title">{p.title}</div>
                <div className="market-list__meta">
                  <span>{p.author}</span>
                  <span>{p.time}</span>
                </div>
                {openId === p.id && (
                  <p style={{ marginTop: "8px", color: "#374151" }}>
                    {p.content}
                  </p>
                )}
              </li>
            ))}
          </ul>
        </section>
      </div>
    </div>
  );
}

/* =============================
   RootApp – 와이어프레임 스타일 통합
   ============================= */
function RootApp() {
  const [user, setUser] = React.useState(null);
  const [tab, setTab] = React.useState("홈");

  const handleLogout = () => {
    setUser(null);
    setTab("홈");
  };

  if (!user) {
    return <AuthScreen onLogin={setUser} />;
  }

  let screen = null;
  if (tab === "홈") screen = <HomeScreen />;
  else if (tab === "마켓") screen = <MarketScreen />;
  else if (tab === "라이브") screen = <LiveScreen />;
  else if (tab === "커뮤니티") screen = <CommunityScreen user={user} />;
  else if (tab === "마이") screen = <MyScreen user={user} onLogout={handleLogout} />;

  return (
    <>
      {screen}
      <BottomNav active={tab} onChange={setTab} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RootApp />);
</script>
</body>
</html>
